<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .config-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    
    .config-header {
      margin-bottom: 30px;
    }
    
    .config-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    
    .config-header p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      transition: border-color 0.2s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #6947BD;
    }
    
    .form-group .help-text {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    
    .btn {
      flex: 1;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #6947BD;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5a3aa3;
    }
    
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    .success-message {
      background: #efe;
      color: #3c3;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    
    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="config-container">
    <div class="config-header">
      <h1>Welcome to Muesli</h1>
      <p>Please log in to get started. You'll be redirected to the login page in your browser.</p>
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>
    
    <div id="loginContainer">
      <div class="form-group">
        <p style="margin-bottom: 20px; color: #666;">Click the button below to open the login page in your browser. After logging in, you'll be automatically redirected back to the app.</p>
      </div>
      
      <div class="button-group">
        <button type="button" class="btn btn-primary" id="loginBtn">Log In</button>
      </div>
      
      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;">
        <p style="font-size: 12px; color: #999; text-align: center;">
          Waiting for login...
        </p>
      </div>
    </div>
  </div>
  
  <script>
    const { ipcRenderer } = require('electron');
    
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
    }
    
    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
    }
    
    function hideMessages() {
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
    }
    
    loginBtn.addEventListener('click', async () => {
      hideMessages();
      loginBtn.disabled = true;
      loginBtn.textContent = 'Opening login page...';
      
      try {
        // Request main process to open login URL
        await ipcRenderer.invoke('open-login');
        showSuccess('Login page opened in your browser. Please complete the login there.');
      } catch (error) {
        showError('Failed to open login page: ' + error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
    
    // Listen for login success from main process
    ipcRenderer.on('login-success', () => {
      showSuccess('Login successful! Closing window...');
      setTimeout(() => {
        ipcRenderer.send('config-saved');
      }, 1000);
    });
    
    // Listen for login error from main process
    ipcRenderer.on('login-error', (event, error) => {
      showError(error || 'Login failed. Please try again.');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log In';
    });
  </script>
</body>
</html>
