name: Build and Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Import Apple Code Signing Certificate (macOS only)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Check if certificate is available
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "No certificate secrets found, skipping certificate import"
            exit 0
          fi
          
          # Create a temporary keychain
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" build.keychain
          
          # List imported certificate to get its name (for CSC_NAME)
          security find-identity -v -p codesigning build.keychain
          
          # Clean up
          rm certificate.p12
          
          # Mark that certificate was imported
          echo "CERTIFICATE_IMPORTED=true" >> $GITHUB_ENV
      
      - name: Package app
        run: npm run package
      
      - name: Create distributables
        env:
          # Set code signing environment variables if certificate is available
          # CSC_NAME should match the certificate name in keychain (e.g., "Developer ID Application: Your Name")
          # You can find this by running: security find-identity -v -p codesigning
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: npm run make
      
      - name: Ad-hoc sign DMG files (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          # Ad-hoc sign DMG files if certificate was not imported
          # This works without a Developer account certificate
          if [ "$CERTIFICATE_IMPORTED" != "true" ]; then
            echo "No certificate imported, attempting ad-hoc signing..."
            for dmg in out/make/*.dmg; do
              if [ -f "$dmg" ]; then
                echo "Signing: $dmg"
                # Ad-hoc sign the DMG (uses "-" identity, no certificate needed)
                codesign --force --deep --sign - "$dmg" 2>/dev/null || echo "Note: Ad-hoc signing may not fully prevent warnings"
              fi
            done
          else
            echo "Certificate was imported, skipping ad-hoc signing"
          fi
      
      - name: Remove quarantine attribute from DMG (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          # Remove quarantine attribute from DMG files
          # Note: This helps, but macOS may re-add quarantine when downloaded
          echo "Removing quarantine attributes from DMG files..."
          for dmg in out/make/*.dmg; do
            if [ -f "$dmg" ]; then
              echo "Processing: $dmg"
              # Remove quarantine attribute
              xattr -d com.apple.quarantine "$dmg" 2>/dev/null || true
              # Remove all extended attributes as fallback
              xattr -c "$dmg" 2>/dev/null || true
            fi
          done
          echo "Quarantine removal complete"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            out/make/**
            !out/make/**/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-latest-build
          path: ./release/macos
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-latest-build
          path: ./release/windows
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/macos/**
            ./release/windows/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

